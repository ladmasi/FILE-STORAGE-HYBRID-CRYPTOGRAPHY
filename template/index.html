  <title>Secure File Storage</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Ensures the video covers the entire area */
      z-index: -1;
      /* Keeps the video in the background */
      background-color: #f0f8ff;
      /* Light background color */
    }

    h2 {
      color: whitesmoke;
      padding: 0px 0;
      text-align: right;
    }

    /* .file {
  display: none;
} */

    .file-name {
      position: relative;
      overflow: hidden;
      line-height: 20px;
      padding: 5px;
      box-sizing: border-box;
      font-size: 15px;
      vertical-align: right;
      width: 300px;
      border: 2px solid #dbdbdb;
      border-radius: 0;
      height: 30px;
    }

    .btn {
      border: none;
      border-radius: 0;
      width: auto;
      box-sizing: border-box;
      padding: 2px 10px;
      transition: all 0.6s;
      color: #FFF;
      font-size: 15px;
      vertical-align: right;
      text-transform: uppercase;
      margin-left: 1rem;
    }

    .btn:hover {
      box-shadow: 0 0 5px #33006e;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>

<script>

  $(document).ready(function () {
    $('.bunton').on('click', function () {
      $('.file').trigger('click');
    });

    $('.file').on('change', function () {
      var fileName = $(this)[0].files[0].name;
      $('#file-name').val(fileName);
    });
  })
</script>
